services:
  poligo:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - poligo-data:/app/data
    environment:
      # the document scanner (Claude vision); without a key it answers with a sample
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # demo = fictional students for the pitch; the real platform adapter replaces it
      - POLIGO_PLATFORM_MODE=${POLIGO_PLATFORM_MODE:-demo}
      - POLIGO_PLATFORM_URL=${POLIGO_PLATFORM_URL:-https://mobilitati.upt.ro}
    restart: unless-stopped

  # Optional Cloudflare Tunnel connector. Off by default; start with:
  #   docker compose --profile tunnel up -d
  # Put the connector token from the Cloudflare Zero Trust dashboard
  # (Networks -> Tunnels) into a .env file next to this compose file:
  #   CLOUDFLARE_TOKEN=...
  # In the dashboard, map your public hostname to http://poligo:8000 - this
  # service runs on the same compose network, so the name "poligo" resolves.
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TOKEN}
    profiles: ["tunnel"]
    depends_on:
      - poligo
    restart: unless-stopped

volumes:
  poligo-data:
